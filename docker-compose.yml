name: homelab

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "128mb"
    volumes:
      - ./config:/config
      - /media/frigate:/media/frigate
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8555:8555/tcp"
      - "127.0.0.1:8555:8555/udp"
    environment:
      - FRIGATE_RTSP_USER=${RTSP_USER}
      - FRIGATE_RTSP_PASSWORD=${RTSP_PASSWORD}
      - FRIGATE_CAMERA_IP=${CAMERA_IP}
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "health", "-m", "check", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 3

  notification-bridge:
    build: ./notification-bridge
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MQTT_HOST=mosquitto
      - FRIGATE_HOST=http://frigate:5000
    depends_on:
      mosquitto:
        condition: service_healthy
      frigate:
        condition: service_started
